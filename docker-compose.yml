services:
  bot:
    build: .
    container_name: zhabilizacia-bot
    # Сам поднимется после отключения света / перезагрузки сервера и если вдруг упадёт
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/zhabilizacia.db
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      # База и бэкапы хранятся на диске сервера в папке ./data рядом с этим файлом
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
